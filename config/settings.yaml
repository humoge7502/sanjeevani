# SANJEEVANI runtime settings.
#
# Everything here is a *knob*, not a hidden constant. Any threshold quoted in
# the UI is traceable to a key in this file (the API exposes it as evidence).

meta:
  config_version: "1.0.0"
  scenario_clock_utc: "2026-09-30T06:00:00Z"

runtime:
  # Offline mode is the DEFAULT and the demo guarantee: no external service is
  # ever load-bearing. Setting this true makes A1 refuse to attempt any network
  # fetch at all (defence in depth -- it currently never does).
  offline: true
  deterministic_seed: 20260930
  # Wall-clock is frozen in demo mode so timestamps are reproducible across runs.
  freeze_clock: true
  # LLM enrichment is OPTIONAL and disabled. When enabled it may only produce
  # narrative text; it may never produce a number used by a contract. The
  # implementation is backend/agents/narrative.py -- see the `narrative:` block.
  llm_enabled: false

narrative:
  # The narrative seam. `runtime.llm_enabled` is the switch; this selects who
  # writes the words.
  #
  #   template - deterministic, local, no credential, no network. Also the
  #              fallback for anything that fails.
  #   remote   - an OpenAI-compatible chat-completions call. Requires `endpoint`
  #              and the credential in `api_key_env`, and is refused while
  #              runtime.offline is true. Its output is NOT reproducible; that is
  #              exactly why nothing reads it.
  #
  # With runtime.llm_enabled false the frozen one-line narrative the demo ships is
  # used unchanged, so the documented output is untouched.
  narrator: template
  #: Full URL of the chat-completions endpoint, e.g.
  #: "https://api.openai.com/v1/chat/completions". Empty disables the remote body.
  endpoint: ""
  #: Never commit a key. Read from the environment at call time.
  api_key_env: "OPENAI_API_KEY"
  model: ""
  temperature: 0.0
  max_tokens: 160
  timeout_seconds: 10.0
  #: Hard cap on the displayed narrative, applied by sanitise().
  max_characters: 600

sensing:
  # A1 -> A2 handoff gate. Below this the candidate stays on the watchlist.
  escalate_confidence: 0.60
  # Used by A1's classifier; free-text is never the source of a number.
  source_class_weights:
    IOT: 1.00
    PORT_AUTHORITY: 0.95
    WEATHER: 0.90
    CARRIER: 0.85
    TRADE_POLICY: 0.85
    NEWS: 0.70
    MANUAL: 0.60
  # Signal-feed ADAPTERS (GDELT, Open-Meteo, Freightos). Definitions live in
  # config/feeds.yaml; this block is only the switch and the cache location.
  feeds:
    # OFF by default, so data/events/hero_feeds.yaml stays the documented demo
    # path with its byte-reproducible numbers. Turning this on REPLACES the
    # scripted feed with adapter output, which is a different scenario by
    # construction -- not the hero one. Override with SANJEEVANI_FEEDS_ENABLED.
    enabled: false
    #: false replays the newest snapshot under snapshot_dir, which is
    #: deterministic. true fetches and writes a new snapshot, and is refused
    #: while runtime.offline is true. Override with SANJEEVANI_FEEDS_LIVE.
    live: false
    #: Where fetch-to-snapshot captures are read from and written to.
    snapshot_dir: "events/snapshots"

verification:
  # The 2-source rule: signals agreeing across this many source CLASSES verify.
  min_source_classes: 2
  # Signals older than this are stale and cannot verify an event on their own.
  max_signal_age_hours: 24.0
  # Dedup window: same type+target inside this window collapses to one event.
  dedup_window_hours: 48.0
  # Verifying a low-reliability single source is not enough.
  min_source_reliability: 0.50

scenario:
  horizons_days: [3, 10, 30]
  # Parameter clamps -- A2 may propose parameters but never outside these bounds.
  clamp:
    duration_days: [1, 60]
    transit_delay_days: [0, 45]
    capacity_factor: [0.05, 1.0]

impact:
  # Stockout model: p = 1 - exp(-shortfall_days / service_recovery_days)
  service_recovery_days: 5.0
  # Cold-chain condemnation model (see backend/agents/impact.py).
  cold_chain:
    tolerable_peak_excess_c: 0.5
    tolerable_minutes: 15.0
    full_condemn_peak_excess_c: 12.0
    full_condemn_degree_hours: 6.0
  # Currency and rounding for reporting (raw floats stay unrounded internally).
  currency: USD
  rounding:
    money_decimals: 2
    ratio_decimals: 4

forecasting:
  # A trained disruption-duration model, generated by
  # scripts/train_forecasting_model.py and served from a portable JSON tree
  # ensemble (no numpy, no scikit-learn at runtime, no pickle).
  #
  # ADVISORY BY DEFAULT. With enabled=false the model still runs and its
  # prediction is attached to the scenario's provenance so a human can see what
  # it would have said -- but it does NOT influence any number. Turning it on
  # lets A2 blend it into the scenario duration, still clamped to the bounds in
  # scenario.clamp, so the trained model can never widen a claim beyond what an
  # operator has authorised.
  enabled: false
  #: Blend weight applied to the model's duration when enabled
  #: (duration = (1 - w) * claim + w * forecast), then clamped.
  blend_weight: 0.5
  #: Inputs the repository cannot derive from its own seed data. Declared here so
  #: nobody is tempted to invent them.
  incident_lookback_days: 90
  carrier_diversion_pct: 35.0

m2:
  # The discrete-event simulation cross-check. Model inputs live in
  # config/des.yaml; this block is the switch and the reporting tolerance.
  #
  # backend/m2/des.py runs a deterministic SimPy event queue over the
  # chokepoint's berth capacity. It answers three questions the closed-form twin
  # cannot: contention (two berths, three consignments), when a consignment
  # actually REACHES the chokepoint, and what two overlapping closures cost
  # (the union of two intervals, not the sum of two durations).
  #
  # ADVISORY BY DEFAULT. The DES always runs for the recommended plan and for
  # every uniform-policy counterfactual, and its verdict is reported beside the
  # twin's -- including when the two disagree. With enabled=false it does NOT
  # add a hard constraint, so the documented plan is untouched.
  des:
    enabled: false
    #: A twin/DES disagreement smaller than this is not reported as a finding.
    contradiction_tolerance_hours: 24.0

persistence:
  # A crash-safe, QUERYABLE SQLite mirror of the append-only JSONL ledger.
  #
  # The JSONL file remains the source of truth and the only thing the hash chain
  # covers; the mirror is never read to decide what happened, only to answer
  # "find me the rows that match". That is what makes it safe to enable: a
  # disagreement between the two can be reported rather than reconciled.
  #
  # OFF by default so the demo's file-only story stays exactly as documented.
  # Turn on with SANJEEVANI_AUDIT_MIRROR=true for any deployment where an
  # operator or a SIEM needs to query the audit trail.
  sqlite_mirror: false
  mirror_path: "runtime/audit_mirror.sqlite3"
  #: Durability of the JSONL append itself.
  #:   none  - write and return (fastest; a power loss can lose the tail)
  #:   flush - flush the Python buffer to the OS (default)
  #:   fsync - flush AND fsync (slowest; survives a power loss)
  ledger_durability: "flush"

governance:
  # Cost-banded approval tiers.
  tiers:
    - id: AUTO
      max_cost: 5000
      required_role: null
      risk_tier: L1
    - id: PLANNER
      max_cost: 50000
      required_role: planner
      risk_tier: L2
    - id: SUPPLY_PLANNING_HEAD
      max_cost: 250000
      required_role: supply_planning_head
      risk_tier: L3
    - id: COO
      max_cost: null
      required_role: coo
      risk_tier: L4
  # A compliance-sensitive plan always escalates at least this far, even when
  # the cost band would allow less.
  compliance_sensitive_min_tier: L3
  # Plans at or above this tier can never auto-execute.
  human_required_from_tier: L3

audit:
  # Append-only JSONL ledger + SHA-256 hash chain for tamper evidence.
  hash_chain: true
  ledger_path: "runtime/audit_ledger.jsonl"
  # Records are never updated or deleted by application code.
  #: Default page size for GET /api/audit, and the hard ceiling a caller may ask
  #: for. Without a cap the endpoint's payload grows with the ledger forever.
  page_size_default: 200
  page_size_max: 1000

api:
  host: "127.0.0.1"
  # 8787 rather than the conventional 8000: 8000 is very commonly occupied by
  # unrelated local services, and a port collision on stage is an avoidable
  # failure. Override with: uvicorn ... --port <n>
  port: 8787
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"

auth:
  # OFF by default. With it off, the offline demo, the browser suite and the
  # container smoke test behave exactly as before, and every audit record says
  # the caller was unauthenticated.
  #
  # With it ON, callers must present a signed token, the approver is taken from
  # that token rather than from the request body, and the ledger records who
  # really acted. Turn on with SANJEEVANI_AUTH_ENABLED=true and a
  # SANJEEVANI_JWT_SECRET of at least 32 bytes; a missing or weak secret is a
  # startup failure, deliberately.
  enabled: false
  #: Never commit a real secret. Supply it via SANJEEVANI_JWT_SECRET.
  jwt_secret: ""
  token_ttl_seconds: 3600
  #: Escape hatch for local development only. Mints a random secret per process,
  #: which invalidates every token on restart, and is reported in /api/health.
  allow_ephemeral_secret: false
  #: Accounts, roles and tenants. Generated by scripts/make_identity.py.
  identity_file: "config/identity.yaml"

security:
  # Response headers plus a nonce-based Content-Security-Policy. On by default:
  # there is no scenario in which sending them is worse than not sending them.
  headers_enabled: true
  #: Extra origins the UI may call. The single-container layout needs none.
  csp_extra_connect_src: []
  rate_limit:
    #: Per-process token buckets. The process IS the deployment here (see
    #: docs/deployment.md), which is what makes an in-process limiter correct
    #: rather than merely convenient.
    enabled: true
    state_changing_per_minute: 60
    state_changing_burst: 20
    read_per_minute: 600
    read_burst: 120
  #: Reject request bodies larger than this before they are parsed. A local
  #: deterministic API has no legitimate multi-megabyte payload.
  max_request_bytes: 65536

