; mypy configuration.
;
;   python -m mypy backend scripts
;
; Strictness is set to what this codebase can actually hold today: full type
; checking on the project's own code, plus the third-party stubs (`types-PyYAML`
; and `types-networkx`, both pinned in requirements-dev.txt) so PyYAML and
; NetworkX calls are checked rather than silenced with per-site `# type: ignore`.
; If those stubs are not installed, re-add the two `ignore_missing_imports`
; overrides for `yaml` and `networkx`.

[mypy]
python_version = 3.11
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
no_implicit_optional = True
strict_equality = True
show_error_codes = True

; The project mixes pydantic models with plain dicts from YAML in a few places.
; Disallow the categories that hide real bugs without demanding annotations on
; every local, which would be noise rather than safety.
disallow_untyped_defs = False
check_untyped_defs = True
