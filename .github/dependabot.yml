version: 2
updates:
  # Python dependencies are fully pinned (==), so an update is always a
  # deliberate, reviewable version bump. Monthly cadence: this is an offline
  # prototype with a small, stable dependency surface, not a fast-moving
  # service; a weekly treadmill would be noise.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      python-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"

  # npm: only the frontend's dev toolchain (react + react-dom are the only
  # runtime dependencies, by design — see ADR 0002).
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      frontend-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"

  # Keep the CI action pins current (checkout / setup-python / setup-node /
  # upload-artifact). Weekly would be noise; monthly is enough for actions.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
